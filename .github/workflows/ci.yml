name: CI

on:
  push:
    branches: [main]
  pull_request:
  # daily: otui against TIMES.jl's newest main (it is in active development)
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: REUSE (licence and copyright for every file)
        run: uvx --from "reuse[charset-normalizer]" reuse lint

  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -m "not julia"

  # otui against both TIMES.jl versions it runs on: pinned (the release gate) and latest (main,
  # the server's default). A latest failure is reported but does not block a merge: the server
  # falls back to pinned.
  timesjl:
    name: timesjl (${{ matrix.channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [pinned, latest]
    permissions:
      contents: read
      actions: write # julia-actions/cache deletes its old caches
    env:
      OTUI_JULIA_ENV: ${{ github.workspace }}/.otui-julia
      OTUI_TIMESJL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - run: uv sync
      - run: uv run otui julia-setup --channel ${{ matrix.channel }}
      - run: uv run otui info
      - run: uv run pytest -m julia
      - run: uv run otui bench

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # the wheel users install: it must carry the built app and its licence notices
      - uses: astral-sh/setup-uv@v6
      - name: Wheel carries the app and the notices
        working-directory: .
        run: |
          uv build --wheel --out-dir dist
          python -c "import zipfile,glob; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); need=['otui/web/index.html','otui/web/THIRD-PARTY-NOTICES.txt']; miss=[x for x in need if x not in n]; assert not miss, miss; assert any(x.endswith('licenses/LICENSES/AGPL-3.0-or-later.txt') for x in n); print(len(n), 'files')"
