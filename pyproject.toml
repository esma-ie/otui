[project]
name = "otui"
version = "0.1.0"
description = "Open TIMES User Interface: a browser GUI for TIMES energy system models"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSES/*.txt"]
authors = [{ name = "Energy Systems Modelling Analytics Ltd (ESMA)" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-multipart>=0.0.33",
    "uvicorn>=0.30",
]

[project.scripts]
otui = "otui.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otui"]
# the browser app is built (frontend/, `npm run build`) into src/otui/web, which git ignores: ship
# it anyway, with its THIRD-PARTY-NOTICES.txt. hatch_build.py refuses a wheel without it.
artifacts = ["src/otui/web/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "julia: needs Julia and otui's Julia environment (otui julia-setup)",
  "local: needs a model folder on this computer (OTUI_TIMES_NZ); skipped without it",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]
